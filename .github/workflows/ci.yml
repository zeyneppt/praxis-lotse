name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  geschuetzte-dateien:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Abnahmekriterien unverändert
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FREIGEGEBEN: ${{ contains(github.event.pull_request.labels.*.name, 'abnahme-aenderung') }}
        run: |
          geaendert=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            tests/acceptance/ eval/fragen.yaml .claude/ CLAUDE.md)
          if [ -z "$geaendert" ]; then
            echo "Keine geschützten Dateien geändert."
            exit 0
          fi
          echo "Geschützte Dateien geändert:"
          echo "$geaendert"
          if [ "$FREIGEGEBEN" = "true" ]; then
            echo "Label abnahme-aenderung gesetzt – erlaubt."
            exit 0
          fi
          echo "::error::Dieser PR ändert Abnahmekriterien. Nur mit Label 'abnahme-aenderung' erlaubt."
          exit 1

  lint-und-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint PYTHON=python
      - run: make test PYTHON=python

  abnahme:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cp .env.example .env
      - name: Berichtsverzeichnisse anlegen (sonst legt Docker sie als root an)
        run: mkdir -p reports/robot reports/eval
      - run: docker compose up -d --build
      - name: Auf /api/health warten
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: pip install -r tests/acceptance/requirements.txt
      - run: rfbrowser init chromium
      - run: make ingest
      - run: make acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-berichte
          path: reports/robot/
      - if: failure()
        run: docker compose logs

  eval:
    # Läuft erst, wenn Spec 007 den Status „fertig" hat.
    runs-on: ubuntu-latest
    needs: abnahme
    env:
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - id: spec007
        run: |
          if grep -q '^\*\*Status:\*\* fertig' specs/007-*.md; then
            echo "aktiv=true" >> "$GITHUB_OUTPUT"
          else
            echo "Spec 007 noch nicht fertig – Eval übersprungen."
            echo "aktiv=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.spec007.outputs.aktiv == 'true'
        run: |
          cp .env.example .env
          mkdir -p reports/robot reports/eval
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/health && break
            sleep 2
          done
          make ingest
          make eval
      - if: always() && steps.spec007.outputs.aktiv == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-berichte
          path: reports/eval/
